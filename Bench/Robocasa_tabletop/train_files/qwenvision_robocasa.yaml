# qwenvision_robocasa.yaml
# QwenVisionGR00T combines VLM vision tokens and CLIP text tokens for the DiT head.
# A shared CLIP text encoder isolates differences between VLM visual representations.

run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
is_debug: false

framework:
  name: QwenVisionGR00T

  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct  # Replace with the local checkpoint path.
    attn_implementation: flash_attention_2

  vision_text_fusion:
    cross_attention_dim: 1024   # Projection output size and DiT cross-attention dimension.
    freeze_vlm: true
    freeze_clip: true           # Freeze the module. CLIP text encoder

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024           # Keep consistent with cross_attention_dim.
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 29
    state_dim: 58
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 15
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 1024  
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024           # Match hidden_size.
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 32    
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224, 224]
    delete_pause_frame: false

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 3000
  save_interval: 100000
  eval_interval: 999999
  learning_rate:
    base: 1e-04
    vlm: 0.0      
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-08
  freeze_modules: 'vlm,clip_text_model'  
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true