run_id: dinov3_clip_groot_robocasa_gr1
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
is_debug: false

framework:
  name: VisionCLIPGR00T
  vision_model: dinov3
  clip_model: openai/clip-vit-base-patch32

  action_model:
    action_model_type: DiT-B
    hidden_size: 768
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 29
    state_dim: 58
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 15
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 768
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 768
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1
    action_type: delta_ee
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224,224]
    delete_pause_frame: false

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 3000
  save_interval: 100000
  eval_interval: 999999
  learning_rate:
    base: 1e-04
    text_projector: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: 'vision_encoder,text_encoder'
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
