run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl]
is_debug: false

framework:
  name: VisionGR00T
  vision_model: "vggt_omega"
  
  action_model:
    action_model_type: DiT-B
    hidden_size: 768          #  Must match DINO-Base; previously 2560.
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 29              # RoboCasa action dimension.
    state_dim: 58               # RoboCasa state dimension.
    future_action_window_size: 15
    action_horizon: 16          #  Required by evaluation.
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 15 #  Use 15 inference steps for evaluation.
    num_target_vision_tokens: 32 
    diffusion_model_cfg:
      cross_attention_dim: 768  #  Must match DINO-Base; previously 2048.
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16   #Number of DiT layers.
      output_dim: 768           #  Aligned with the hidden size; previously 2560.
      positional_embeddings: null

datasets:
  #  Pure-vision training does not require a vlm_data block. 
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
    data_mix: fourier_gr1_unified_1 # RoboCasa dataset mixture.
    action_type: delta_ee       # Use delta end-effector control.
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs: ["image_0"]            # Add more entries for multi-view RoboCasa observations.
    image_size: [224,224]
    delete_pause_frame: false
    # Limit complete episodes for data-scale experiments. Keep this seed fixed
    # so 50 is a subset of 100, 200, 500, and 1000.
    max_trajectories: 1000
    trajectory_subset_seed: 42

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 3000
  save_interval: 100000
  eval_interval: 999999         #  Disable online evaluation during training.
  learning_rate:
    base: 1e-04                 # Learning rate for pure-vision training.
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-08
  # freeze_modules: 'vision_encoder' # Freeze the module. 
  freeze_modules: '' 
  loss_scale:
    vla: 1.0
    # vlm: 0.1 (removed)
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
