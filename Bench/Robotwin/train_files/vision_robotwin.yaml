seed: 42
trackers: [jsonl]
is_debug: false

framework:
  name: VisionGR00T
  vision_model: dinov2

  action_model:
    action_model_type: DiT-B
    hidden_size: 768               # VisionGR00T overrides this value to match vision_dim.
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 768     # VisionGR00T overrides this value.
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/RoboTwin_LeRobot_HeadCam
    data_mix: robotwin_all
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: False
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 32
    load_all_data_for_training: true
    obs: ["image_0", "image_1", "image_2"]
    image_size: [224, 224]
    video_backend: pyav
    delete_pause_frame: false
    max_trajectories: 500
    trajectory_subset_seed: 42

trainer:
  epochs: 100
  max_train_steps: 40000
  num_warmup_steps: 5000
  save_interval: 20000
  eval_interval: 999999
  learning_rate:
    base: 1e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: 'vision_encoder'
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
