defaults:
  - model: dinov3
  - _self_

device: cuda:0
batch_size: 8
output_dir: ${hydra:runtime.output_dir}

# Video config
video_path: null
frame_start: null
frame_end: null
representative_frame_index: 0  # Used only when video_path is a directory

# Output config
addition_name: null
data_name: null
stride: 1

# Analysis method (required)
analysis: null
analysis_name: null

# Additional parameters for specific analyses
num_bins: 16  # For temporal_token_norm_entropy

hydra:
  run:
    dir: Analyze/outputs/${format_dir:${format_model:${model.model_name}},${addition_name}}/${data_name}
