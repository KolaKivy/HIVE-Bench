# RoboTwin fine-tuned VGGT-Omega aggregator.
#
# The checkpoint (its own config.yaml records `vision_model: vggt_omega`) contains
# `vision_encoder.aggregator.inter_frame_blocks.*` / `attn.qkv.bias_mask`, i.e. VGGT-Omega
# weights. They cannot be restored into the original VGGT-1B wrapper
# (facebook/VGGT-1B-Commercial, `aggregator.global_blocks`), so this config uses the
# VGGT-Omega wrapper; use `model=vggt_omega` for the matching pre-fine-tuning baseline.
# Alternative checkpoint with the newer run naming:
#   playground/Checkpoints/all_task_vggt_omega_ft_robotwin_new/final_model/pytorch_model.pt
_target_: vision_models.vggt_omega.VGGTOmegaModel
model_name: facebook/VGGT-Omega
weight_file: vggt_omega_1b_512.pt
repo_path: third_party/VGGT_Omega
image_size: 224
token_mode: patch
ckpt_dir: playground/Checkpoints/all_task_robotwin_vggt_og_ft/final_model/pytorch_model.pt
